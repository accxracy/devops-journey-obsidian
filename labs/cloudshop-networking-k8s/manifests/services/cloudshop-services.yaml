apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: cloudshop
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: cloudshop
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 80
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: cloudshop
spec:
  selector:
    app: user-service
  ports:
    - port: 3001
      targetPort: 80
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: cloudshop
spec:
  selector:
    app: product-service
  ports:
    - port: 3002
      targetPort: 80
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cloudshop
spec:
  selector:
    app: order-service
  ports:
    - port: 3003
      targetPort: 80
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: cloudshop
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort

---

apiVersion: v1
kind: Service
metadata:
  name: api-loadbalancer
  namespace: cloudshop
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  
  
  